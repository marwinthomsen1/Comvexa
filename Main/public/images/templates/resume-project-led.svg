12597" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2117.6826196473553">Project Coordinator · Northstar Studio</tspan><tspan x="149.92443324937028" y="2178.589420654912">2023–Present</tspan><tspan x="149.92443324937028" y="2239.4962216624685">Led cross-functional planning for six client projects. Introduced a weekly review that</tspan><tspan x="149.92443324937028" y="2300.403022670025">reduced handoff delays by 20%.</tspan><tspan x="149.92443324937028" y="2361.3098236775822"></tspan><tspan x="149.92443324937028" y="2422.216624685139">Project Assistant · Alder Works</tspan><tspan x="149.92443324937028" y="2483.1234256926955">2021–2023</tspan><tspan x="149.92443324937028" y="2544.030226700252">Coordinated schedules, documented decisions and supported the delivery of a new</tspan><tspan x="149.92443324937028" y="2604.9370277078087">customer service program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2964.1309823677584">EDUCATION</tspan></text><rect x="149.92443324937028" y="3017.2292191435768" width="2180.1511335012597" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="3101.5617128463473">BA, Business &amp; Communication</tspan><tspan x="149.92443324937028" y="3158.4080604534">Westbridge College · 2017–2021</tspan><tspan x="149.92443324937028" y="3215.254408060453">Capstone: accessible services for local communities.</tspan></text></svg>