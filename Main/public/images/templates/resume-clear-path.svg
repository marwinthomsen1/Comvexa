uced a weekly review that</tspan><tspan x="149.92443324937028" y="1319.6473551637282">reduced handoff delays by 20%.</tspan><tspan x="149.92443324937028" y="1380.5541561712848"></tspan><tspan x="149.92443324937028" y="1441.4609571788415">Project Assistant · Alder Works</tspan><tspan x="149.92443324937028" y="1502.367758186398">2021–2023</tspan><tspan x="149.92443324937028" y="1563.274559193955">Coordinated schedules, documented decisions and supported the delivery of a new</tspan><tspan x="149.92443324937028" y="1624.1813602015116">customer service program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2039.5969773299748">EDUCATION</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2177.027707808564">BA, Business &amp; Communication</tspan><tspan x="149.92443324937028" y="2233.874055415617">Westbridge College · 2017–2021</tspan><tspan x="149.92443324937028" y="2290.72040302267">Capstone: accessible services for local communities.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2558.0856423173805">SKILLS</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2695.51637279597">Project planning · Research &amp; analysis · Stakeholder communication · Documentation ·</tspan><tspan x="149.92443324937028" y="2752.3627204030226">Presentation design · Team collaboration</tspan></text></svg>