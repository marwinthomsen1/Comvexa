<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="480" height="270"><rect width="1600" height="900" fill="#ffffff"/><rect x="72" y="73" width="60" height="5" fill="#244e61"/><rect x="72" y="815" width="1456" height="1" fill="#d5dfe5"/><text font-family="Arial" font-size="19" font-weight="bold" fill="#506070" text-anchor="start"><tspan x="72" y="74">CLASSROOM STORY</tspan></text><text font-family="Arial" font-size="60" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="72" y="195">What we discovered</tspan></text><text font-family="Arial" font-size="28" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="72" y="298">Show the approach, then explain the value.</tspan></text><rect x="72" y="390" width="680" height="350" fill="#edf2f3"/><text font-family="Arial" font-size="36" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="104" y="461">Approach</tspan></text><text font-family="Arial" font-size="29" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="104" y="559">Start small, learn from feedback and</tspan><tspan x="104" y="596.7">refine the experience with your team.</tspan></text><text font-family="Arial" font-size="36" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="840" y="461">Value</tspan></text><text font-family="Arial" font-size="29" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="840" y="559">Connect your proposed work to a useful,</tspan><tspan x="840" y="596.7">measurable outcome.</tspan></text><text font-family="Arial" font-size="18" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="72" y="778">Make the idea tangible</tspan></text><text font-family="Arial" font-size="18" font-weight="normal" fill="#506070" text-anchor="end"><tspan x="1530" y="843">03</tspan></text></svg>