<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="480" height="679"><rect width="2480" height="3508" fill="#ffffff"/><text font-family="Arial" font-size="106.19647355163728" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="212.39294710327457">ALEX MORGAN</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="371.6876574307305">Project &amp; Operations Professional</tspan></text><text font-family="Arial" font-size="37.48110831234257" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="149.92443324937028" y="381.0579345088162">alex.morgan@example.com</tspan><tspan x="149.92443324937028" y="429.78337531486153">+1 202-555-0147 · Westbridge</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="524.7355163727959">PROFILE</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="662.1662468513854">Thoughtful professional who turns complex challenges into clear, useful outcomes. Brings a</tspan><tspan x="149.92443324937028" y="719.0125944584382">collaborative approach, careful research and a commitment to quality.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="930.7808564231738">SKILLS</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1068.2115869017632">Project planning · Research &amp; analysis · Stakeholder communication · Documentation ·</tspan><tspan x="149.92443324937028" y="1125.057934508816">Presentation design · Team collaboration</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1399.294710327456">EXPERIENCE</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1539.8488664987406">Project Coordinator · Northstar Studio</tspan><tspan x="149.92443324937028" y="1600.7556675062972">2023–Present</tspan><tspan x="149.92443324937028" y="1661.662468513854">Led cross-functional planning for six client projects. Introduced a weekly review that</tspan><tspan x="149.92443324937028" y="1722.5692695214107">reduced handoff delays by 20%.</tspan><tspan x="149.92443324937028" y="1783.4760705289673"></tspan><tspan x="149.92443324937028" y="1844.382871536524">Project Assistant · Alder Works</tspan><tspan x="149.92443324937028" y="1905.2896725440805">2021–2023</tspan><tspan x="149.92443324937028" y="1966.1964735516374">Coordinated schedules, documented decisions and supported the delivery of a new</tspan><tspan x="149.92443324937028" y="2027.103274559194">customer service program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2492.493702770781">EDUCATION</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2629.92443324937">BA, Business &amp; Communication</tspan><tspan x="149.92443324937028" y="2686.770780856423">Westbridge College · 2017–2021</tspan><tspan x="149.92443324937028" y="2743.6171284634756">Capstone: accessible services for local communities.</tspan></text></svg>