span><tspan x="149.92443324937028" y="2123.3047858942064">Built a shared guide to make team onboarding easier.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2476.876574307305">EXPERIENCE</tspan></text><rect x="149.92443324937028" y="2529.9748110831233" width="2180.1511335012597" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2617.4307304785893">Research Intern · Alder Works</tspan><tspan x="149.92443324937028" y="2678.337531486146">Summer 2024</tspan><tspan x="149.92443324937028" y="2739.2443324937026">Organized interview notes and helped prepare a community research report.</tspan><tspan x="149.92443324937028" y="2800.151133501259"></tspan><tspan x="149.92443324937028" y="2861.0579345088163">Student Volunteer · Campus Collective</tspan><tspan x="149.92443324937028" y="2921.964735516373">2023–2024</tspan><tspan x="149.92443324937028" y="2982.8715365239295">Planned workshops and coordinated student communications.</tspan></text></svg>