<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="480" height="679"><rect width="2480" height="3508" fill="#ffffff"/><rect x="149.92443324937028" y="490.37783375314865" width="2180.1511335012597" height="9.370277078085643" fill="#244e61"/><text font-family="Arial" font-size="106.19647355163728" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="243.62720403022672">ALEX MORGAN</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="371.6876574307305">Project &amp; Operations Professional</tspan></text><text font-family="Arial" font-size="37.48110831234257" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="149.92443324937028" y="468.5138539042821">alex.morgan@example.com</tspan><tspan x="149.92443324937028" y="517.2392947103274">+1 202-555-0147 · Westbridge</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="634.0554156171285">PROFILE</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="771.4861460957179">Thoughtful professional who turns complex challenges into clear, useful outcomes. Brings a</tspan><tspan x="149.92443324937028" y="828.3324937027708">collaborative approach, careful research and a commitment to quality.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1058.8413098236776">EDUCATION</tspan></text><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1196.272040302267">BA, Business &amp; Communication</tspan><tspan x="149.92443324937028" y="1253.1183879093198">Westbridge College · 2017–2021</tspan><tspan x="149.92443324937028" y="1309.9647355163727">Capstone: accessible services for local communities.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1577.329974811083">EXPERIENCE</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1717.8841309823679">Project Coordinator · Northstar Studio</tspan><tspan x="149.92443324937028" y="1778.7909319899245">2023–Present</tspan><tspan x="149.92443324937028" y="1839.6977329974811">Led cross-functional planning for six client projects. Introduced a weekly review that</tspan><tspan x="149.92443324937028" y="1900.604534005038">reduced handoff delays by 20%.</tspan><tspan x="149.92443324937028" y="1961.5113350125946"></tspan><tspan x="149.92443324937028" y="2022.4181360201512">Project Assistant · Alder Works</tspan><tspan x="149.92443324937028" y="2083.324937027708">2021–2023</tspan><tspan x="149.92443324937028" y="2144.2317380352647">Coordinated schedules, documented decisions and supported the delivery of a new</tspan><tspan x="149.92443324937028" y="2205.1385390428213">customer service program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2595.566750629723">SELECTED PROJECTS</tspan></text><text font-family="Arial" font-size="37.48110831234257" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2726.750629722922">Community service redesign</tspan><tspan x="149.92443324937028" y="2775.4760705289673">Mapped customer journeys and tested clearer information with a small research group.</tspan><tspan x="149.92443324937028" y="2824.2015113350126"></tspan><tspan x="149.92443324937028" y="2872.926952141058">Knowledge library</tspan><tspan x="149.92443324937028" y="2921.652392947103">Built a shared guide to make team onboarding easier.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="3101.5617128463477">SKILLS</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="3235.869017632242">Project planning · Research &amp; analysis · Stakeholder communication · Documentation · Presentation</tspan><tspan x="149.92443324937028" y="3288.654911838791">design · Team collaboration</tspan></text></svg>