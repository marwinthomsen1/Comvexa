<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="480" height="679"><rect width="2480" height="3508" fill="#ffffff"/><rect x="0" y="0" width="49.97481108312343" height="3507.6070528967257" fill="#244e61"/><rect x="149.92443324937028" y="671.5365239294711" width="2180.1511335012597" height="9.370277078085643" fill="#244e61"/><text font-family="Arial" font-size="149.92443324937028" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="287.35516372795973">ALEX MORGAN</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="465.39042821158694">Design &amp; Creative Operations</tspan></text><text font-family="Arial" font-size="37.48110831234257" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="149.92443324937028" y="574.7103274559195">alex.morgan@example.com</tspan><tspan x="149.92443324937028" y="623.4357682619648">+1 202-555-0147 · Westbridge</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="821.4609571788413">PROFILE</tspan></text><rect x="149.92443324937028" y="874.55919395466" width="1374.3073047858943" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="958.8916876574308">Thoughtful professional who turns complex challenges into</tspan><tspan x="149.92443324937028" y="1015.7380352644836">clear, useful outcomes. Brings a collaborative approach,</tspan><tspan x="149.92443324937028" y="1072.5843828715365">careful research and a commitment to quality.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="1686.6498740554157" y="821.4609571788413">EDUCATION</tspan></text><rect x="1686.6498740554157" y="874.55919395466" width="643.4256926952141" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="1686.6498740554157" y="958.8916876574308">BA, Business &amp;</tspan><tspan x="1686.6498740554157" y="1015.7380352644836">Communication</tspan><tspan x="1686.6498740554157" y="1072.5843828715365">Westbridge College ·</tspan><tspan x="1686.6498740554157" y="1129.4307304785896">2017–2021</tspan><tspan x="1686.6498740554157" y="1186.2770780856424">Capstone: accessible</tspan><tspan x="1686.6498740554157" y="1243.1234256926953">services for local</tspan><tspan x="1686.6498740554157" y="1299.969773299748">communities.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1383.6775818639799">EXPERIENCE</tspan></text><rect x="149.92443324937028" y="1436.7758186397984" width="1374.3073047858943" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1524.2317380352647">Project Coordinator · Northstar Studio</tspan><tspan x="149.92443324937028" y="1585.1385390428213">2023–Present</tspan><tspan x="149.92443324937028" y="1646.045340050378">Led cross-functional planning for six client projects.</tspan><tspan x="149.92443324937028" y="1706.9521410579348">Introduced a weekly review that reduced handoff</tspan><tspan x="149.92443324937028" y="1767.8589420654914">delays by 20%.</tspan><tspan x="149.92443324937028" y="1828.765743073048"></tspan><tspan x="149.92443324937028" y="1889.672544080605">Project Assistant · Alder Works</tspan><tspan x="149.92443324937028" y="1950.5793450881615">2021–2023</tspan><tspan x="149.92443324937028" y="2011.4861460957181">Coordinated schedules, documented decisions and</tspan><tspan x="149.92443324937028" y="2072.3929471032748">supported the delivery of a new customer service</tspan><tspan x="149.92443324937028" y="2133.2997481108314">program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="1686.6498740554157" y="1696.0201511335013">SKILLS</tspan></text><rect x="1686.6498740554157" y="1749.11838790932" width="643.4256926952141" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="1686.6498740554157" y="1833.4508816120908">Project planning</tspan><tspan x="1686.6498740554157" y="1890.2972292191437">Research &amp; analysis</tspan><tspan x="1686.6498740554157" y="1947.1435768261965">Stakeholder communication</tspan><tspan x="1686.6498740554157" y="2003.9899244332496">Documentation</tspan><tspan x="1686.6498740554157" y="2060.8362720403024">Presentation design</tspan><tspan x="1686.6498740554157" y="2117.6826196473553">Team collaboration</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="2639.294710327456">SELECTED PROJECTS</tspan></text><rect x="149.92443324937028" y="2692.3929471032748" width="2180.1511335012597" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2776.7254408060453">Community service redesign</tspan><tspan x="149.92443324937028" y="2833.571788413098">Mapped customer journeys and tested clearer information with a small research group.</tspan><tspan x="149.92443324937028" y="2890.418136020151"></tspan><tspan x="149.92443324937028" y="2947.264483627204">Knowledge library</tspan><tspan x="149.92443324937028" y="3004.1108312342567">Built a shared guide to make team onboarding easier.</tspan></text></svg>