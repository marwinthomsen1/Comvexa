<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="480" height="679"><rect width="2480" height="3508" fill="#ffffff"/><text font-family="Georgia" font-size="112.44332493702771" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="262.36775818639796">ALDER STUDIO</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="149.92443324937028" y="452.89672544080605">alex.morgan@example.com · Westbridge</tspan></text><rect x="149.92443324937028" y="624.6851385390428" width="2180.1511335012597" height="6.246851385390428" fill="#244e61"/><text font-family="Arial" font-size="56.221662468513856" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="837.0780856423174">14 November 2026</tspan><tspan x="149.92443324937028" y="910.1662468513855"></tspan><tspan x="149.92443324937028" y="983.2544080604534">Dear Alex,</tspan></text><text font-family="Georgia" font-size="59.34508816120907" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1433.6523929471034">Thank you for sharing your ideas with us. We are pleased to outline</tspan><tspan x="149.92443324937028" y="1510.8010075566751">the next steps for our upcoming collaboration.</tspan><tspan x="149.92443324937028" y="1587.949622166247"></tspan><tspan x="149.92443324937028" y="1665.0982367758188">Our team will prepare a project brief, confirm the schedule and</tspan><tspan x="149.92443324937028" y="1742.2468513853905">arrange an introductory workshop. Please review the enclosed details</tspan><tspan x="149.92443324937028" y="1819.3954659949623">and share any questions before we begin.</tspan><tspan x="149.92443324937028" y="1896.5440806045342"></tspan><tspan x="149.92443324937028" y="1973.692695214106">We look forward to creating something useful together.</tspan><tspan x="149.92443324937028" y="2050.841309823678"></tspan><tspan x="149.92443324937028" y="2127.9899244332496">Kind regards,</tspan><tspan x="149.92443324937028" y="2205.1385390428213">Alex Morgan</tspan><tspan x="149.92443324937028" y="2282.287153652393">Studio Director</tspan></text></svg>