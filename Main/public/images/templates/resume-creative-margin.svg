93.2997481108313" y="2658.035264483627">program.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="915.1637279596978">SKILLS</tspan></text><rect x="149.92443324937028" y="968.2619647355164" width="593.4508816120907" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="1052.5944584382871">Project planning</tspan><tspan x="149.92443324937028" y="1109.44080604534">Research &amp; analysis</tspan><tspan x="149.92443324937028" y="1166.2871536523928">Stakeholder</tspan><tspan x="149.92443324937028" y="1223.133501259446">communication</tspan><tspan x="149.92443324937028" y="1279.9798488664987">Documentation</tspan><tspan x="149.92443324937028" y="1336.8261964735516">Presentation design</tspan><tspan x="149.92443324937028" y="1393.6725440806044">Team collaboration</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1914.6599496221663">EDUCATION</tspan></text><rect x="149.92443324937028" y="1967.758186397985" width="593.4508816120907" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="2052.0906801007554">BA, Business &amp;</tspan><tspan x="149.92443324937028" y="2108.9370277078083">Communication</tspan><tspan x="149.92443324937028" y="2165.783375314861">Westbridge College ·</tspan><tspan x="149.92443324937028" y="2222.629722921914">2017–2021</tspan><tspan x="149.92443324937028" y="2279.476070528967">Capstone: accessible</tspan><tspan x="149.92443324937028" y="2336.32241813602">services for local</tspan><tspan x="149.92443324937028" y="2393.168765743073">communities.</tspan></text></svg>