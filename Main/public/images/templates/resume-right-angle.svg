<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 3508" width="480" height="679"><rect width="2480" height="3508" fill="#ffffff"/><rect x="1636.6750629722922" y="599.6977329974811" width="768.3627204030226" height="2692.3929471032748" fill="#edf2f3"/><text font-family="Arial" font-size="106.19647355163728" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="243.62720403022672">ALEX MORGAN</tspan></text><text font-family="Arial" font-size="46.85138539042821" font-weight="normal" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="371.6876574307305">Project &amp; Operations Professional</tspan></text><text font-family="Arial" font-size="37.48110831234257" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="149.92443324937028" y="468.5138539042821">alex.morgan@example.com</tspan><tspan x="149.92443324937028" y="517.2392947103274">+1 202-555-0147 · Westbridge</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="665.2896725440805">PROFILE</tspan></text><rect x="149.92443324937028" y="718.3879093198992" width="1405.5415617128465" height="3.123425692695214" fill="#ced8de"/><text font-family="Arial" font-size="43.727959697733" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="149.92443324937028" y="802.7204030226701">Thoughtful professional who turns complex challenges into</tspan><tspan x="149.92443324937028" y="859.566750629723">clear, useful outcomes. Brings a collaborative approach,</tspan><tspan x="149.92443324937028" y="916.4130982367759">careful research and a commitment to quality.</tspan></text><text font-family="Arial" font-size="40.604534005037785" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="149.92443324937028" y="1146.2972292191437">EXPERIENCE</tspan></text><rect x="149.92443324937028" y="1199.3954659949623" width="1405.5415617128465" height="3.1234256