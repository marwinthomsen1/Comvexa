<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="480" height="270"><rect width="1600" height="900" fill="#ffffff"/><rect x="72" y="73" width="60" height="5" fill="#244e61"/><rect x="72" y="815" width="1456" height="1" fill="#d5dfe5"/><text font-family="Arial" font-size="19" font-weight="bold" fill="#506070" text-anchor="start"><tspan x="72" y="74">STARTUP PITCH</tspan></text><text font-family="Arial" font-size="60" font-weight="bold" fill="#202c38" text-anchor="start"><tspan x="72" y="195">Our solution</tspan></text><text font-family="Arial" font-size="28" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="72" y="298">Show the approach, then explain the value.</tspan></text><rect x="72" y="390" width="440" height="340" fill="#eaf0f3"/><text font-family="Arial" font-size="23" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="102" y="448">THE SOLUTION</tspan></text><text font-family="Arial" font-size="31" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="102" y="536">One clear experience.</tspan><tspan x="102" y="576.3">Less friction.</tspan><tspan x="102" y="616.6">More useful outcomes.</tspan></text><text font-family="Arial" font-size="36" font-weight="bold" fill="#244e61" text-anchor="start"><tspan x="610" y="426">Approach</tspan></text><text font-family="Arial" font-size="30" font-weight="normal" fill="#202c38" text-anchor="start"><tspan x="610" y="520">Start small, learn from feedback and refine the</tspan><tspan x="610" y="559">experience with your team.</tspan></text><text font-family="Arial" font-size="18" font-weight="normal" fill="#506070" text-anchor="start"><tspan x="72" y="778">Make the idea tangible</tspan></text><text font-family="Arial" font-size="18" font-weight="normal" fill="#506070" text-anchor="end"><tspan x="1530" y="843">03</tspan></text></svg>